<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargador de Imagenes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bglight text-dark py-4">
    <h3 class="text-center mb-2">Cargador de Imagenes</h3>

    <section class="container mb-4">
      <div class="d-flex justify-content-center gap-2 mb-3">
        <form>
          <button class="btn btn-primary" id="loadImgBtn" type="button">
            Cargar Imagen
          </button>
          <input id="imageFile" type="file" accept="image/*" hidden />
        </form>
      </div>
    </section>

    <section class="container">
      <div
        id="image-container"
        class="d-flex justify-content-center gap-2 mb-3 img-fluid w-50 object-fit-cover"
        style="height: 200px"
      ></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
